worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not write filenames/search queries into access logs.
    log_format concise '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout concise;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Match Flask's default full-request limit, including multipart overhead.
        client_max_body_size 25m;
        error_page 413 = @too_large;

        location = /frontend-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location ~ ^/(health|transcribe|transcriptions|search)$ {
            # Re-resolve Compose DNS after backend replacement; preserve query
            # strings and avoid caching a container IP for nginx's whole lifetime.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend backend:5000;
            proxy_pass http://$backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
            # A failed connection can follow a successful commit: never retry POST.
            proxy_next_upstream off;
            proxy_intercept_errors off;
            # Defining location-level error pages disables server inheritance.
            error_page 413 = @too_large;
            error_page 502 504 = @unavailable;
        }

        location @too_large {
            default_type application/json;
            return 413 '{"error":{"code":"payload_too_large","message":"The request exceeds the 25 MiB limit."}}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"service_unavailable","message":"Backend unavailable or timed out. Refresh the list before retrying an upload; it may have been saved."}}';
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
