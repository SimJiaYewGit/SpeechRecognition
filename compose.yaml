services:
  frontend:
    build:
      context: ./frontend
    image: speech-rec-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: speech-rec-backend:local
    ports:
      # Keep the assignment service local; avoid the native dev server's port.
      - "127.0.0.1:8000:5000"
    environment:
      DATABASE_PATH: /data/transcriptions.sqlite3
      UPLOAD_DIR: /data/uploads
      MODEL_CACHE_DIR: /models
      PORT: "5000"
      MAX_CONTENT_LENGTH: "26214400"
      MAX_AUDIO_DURATION_SECONDS: "600"
    volumes:
      - transcription-data:/data
      - whisper-models:/models
    init: true
    stop_grace_period: 610s
    restart: unless-stopped

volumes:
  transcription-data:
  whisper-models:
